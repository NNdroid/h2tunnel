name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Manual runs (Actions page or API) without needing a new push, e.g. to
  # re-verify a flaky or infrastructure-dependent job on the same commit.
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # MASQUE-over-h2 (the client MasqueALPN=h2/auto fallback leg) needs x/net
      # extended CONNECT; without it the matching assertions are skipped. GODEBUG
      # must take effect at process start, so it lives at the job level.
      GODEBUG: http2xconnect=1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Build
        shell: bash
        run: go build -v ./...

      - name: Build (32-bit compatibility)
        # Releases ship linux/386 and linux/arm (GOARM=6) binaries. These
        # targets have a 32-bit int and stricter 64-bit atomic alignment
        # rules, so keep them compiling on every push instead of first
        # failing when cutting a release.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          GOOS=linux GOARCH=386 go build ./...
          GOOS=linux GOARCH=arm GOARM=6 go build ./...

      - name: Enable large UDP datagrams on macOS
        # Darwin's default UDP send space is only 9216 bytes. The 48 KB
        # integration test needs both the tunnel target and echo to send it.
        # Set this before creating sockets; keep the full payload assertion.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sysctl net.inet.udp.maxdgram
          sudo sysctl -w net.inet.udp.maxdgram=65535
          test "$(sysctl -n net.inet.udp.maxdgram)" -ge 48000

      - name: Test (race)
        # quic-go officially does not support Go's race detector on Windows:
        # native crash (Exception 0xc0000005 / unknown pc, see the race
        # detector limitation section in the quic-go README). Race detection on
        # all pure-Go code is covered by linux/macos; Windows runs functional
        # tests only.
        if: runner.os != 'Windows'
        shell: bash
        run: go test -v -timeout 15m -race -coverprofile=coverage.out ./...

      - name: Test (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: go test -v -timeout 15m ./...

      - name: Benchmark (Linux only)
        # go test does not run Benchmark functions by default (needs -bench);
        # run all benchmarks once on a single platform: confirm the benchmarks
        # execute + emit throughput reference values. No -race (race distorts
        # the numbers by orders of magnitude). Absolute values on shared CI
        # runners are noisy, so judge performance regressions from local
        # multi-round results; treat CI numbers as magnitudes / error presence.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -run '^$' -bench . -benchtime 1s -timeout 25m ./...

      - name: Upload coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # test-32bit: run the suite for real on the two 32-bit release targets.
  #
  # The compile gate in the test job above only proves the code builds with a
  # 32-bit int; this job proves it runs. That catches a different class of bug:
  # int truncation in hot paths (benchmarks run long enough for counters to
  # cross 2^31), unaligned or too-small atomic access, and code paths that the
  # suite only reaches under a 32-bit address space.
  #
  # GitHub's hosted runners are 64-bit only, so the binaries execute under
  # user-mode emulation. qemu-user talks to the host kernel directly, so
  # loopback TCP/UDP and QUIC sockets behave the same as on a real 32-bit
  # board. The runners do not mount binfmt_misc, so the kernel cannot route
  # 32-bit ELF execution to qemu by itself; instead the job registers the
  # wrapper that the go tool already supports for exactly this case -- when
  # GOOS/GOARCH differ from the host, `go test` runs the test binary through
  # an executable named go_<goos>_<goarch>_exec found on PATH. Registering one
  # wrapper is all that is needed, and the rest of the job stays plain
  # `go test`.
  test-32bit:
    name: Test 32-bit (${{ matrix.label }})
    runs-on: ubuntu-latest
    # Backstop only: each step carries its own -timeout, and qemu-arm on an
    # x86 host is several times slower than qemu-i386, so the arm run gets room
    # without an unbounded wait.
    timeout-minutes: 90
    env:
      # Same as the native test job: GODEBUG must be in place before the test
      # process starts, or the MASQUE-over-h2 assertions skip silently.
      GODEBUG: http2xconnect=1
      # Match the shipped linux_arm binary exactly (release.yml builds it with
      # GOARM=6). GOARM is ignored for non-arm targets, so this is harmless for
      # 386.
      GOARM: "6"
      # No cgo anywhere in the repo; pinning it keeps the emulated binaries
      # static and free of host library assumptions.
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "386"
            label: linux/386
            qemu: i386
          - arch: arm
            label: linux/arm GOARM=6
            qemu: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Register qemu-user as the go cross-exec wrapper
        # qemu-user-static provides the static emulators and needs no binfmt
        # registration to be driven explicitly, which is what the wrapper does.
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          QEMU=/usr/bin/qemu-${{ matrix.qemu }}-static
          [ -x "$QEMU" ] || QEMU=/usr/bin/qemu-${{ matrix.qemu }}
          if [ ! -x "$QEMU" ]; then
            echo "no qemu-user emulator for ${{ matrix.arch }}:"
            ls -l /usr/bin | grep -i qemu || true
            exit 1
          fi
          mkdir -p /tmp/cross-exec
          printf '#!/bin/bash\nexec %q "$@"\n' "$QEMU" > "/tmp/cross-exec/go_linux_${{ matrix.arch }}_exec"
          chmod +x "/tmp/cross-exec/go_linux_${{ matrix.arch }}_exec"
          # GITHUB_PATH only reaches later steps, so verify the wrapper here and
          # prove it in the next step (go vet + go run + one test).
          [ -x "/tmp/cross-exec/go_linux_${{ matrix.arch }}_exec" ]
          echo "/tmp/cross-exec" >> "$GITHUB_PATH"
          cat "/tmp/cross-exec/go_linux_${{ matrix.arch }}_exec"

      - name: Vet + smoke test (proves the target execs and runs)
        # Vet first on the 32-bit target (the native job only vets the host
        # arch). `go run` also goes through the cross-exec wrapper, so printing
        # the version is the shortest proof that a real 32-bit binary built by
        # this job can be executed -- a broken emulator fails here in seconds
        # instead of ten minutes into the suite. The single fast test then
        # covers the same path for test binaries.
        shell: bash
        run: |
          export GOOS=linux GOARCH=${{ matrix.arch }}
          go vet ./...
          go run ./cmd/h2tunnel version
          go test -count=1 -run 'TestConfigValidationCanonicalizesDefaults' -timeout 3m .

      - name: Test suite
        # No -race: the race detector plus user-mode emulation is an order of
        # magnitude too slow to fit this job, and quic-go documents that the
        # detector is unsupported on some platforms. Data-race coverage of the
        # same code is already native on 64-bit (the test job's race step).
        # The timeout is ~2x the native one: emulation slows CPU-bound work, and
        # several tests wait out real timers.
        shell: bash
        run: |
          export GOOS=linux GOARCH=${{ matrix.arch }}
          go test -v -count=1 -timeout 30m -coverprofile=coverage-32.out ./...

      - name: Benchmarks
        # Benchmarks on an emulated CPU are canaries, not measurements: they
        # prove the hot paths execute on a 32-bit int without truncation or
        # misalignment faults and still emit sane throughput. Absolute values
        # here must never be compared with the native Benchmark (Linux only)
        # step -- the two differ by the emulation factor, which varies per run.
        # -benchtime is shorter than the native step for the same reason.
        shell: bash
        run: |
          export GOOS=linux GOARCH=${{ matrix.arch }}
          go test -run '^$' -bench . -benchtime 500ms -count=1 -timeout 25m ./...

      - name: Upload 32-bit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-32bit-${{ matrix.arch }}
          path: coverage-32.out
          if-no-files-found: warn
          retention-days: 7

  # weaknet: the weak-link benchmark suite, in its own job so its run time does
  # not add to the main matrix.
  #
  # The link is simulated in userspace (see weaknet_bench_test.go for why): a
  # kernel qdisc cannot inject loss into a TCP leg at all, because the kernel
  # retransmitter hides it from a byte stream. Userspace injection reaches the
  # QUIC legs at datagram granularity and stays honest about the TCP legs, where
  # the visible effect is added latency rather than drops. The kernel's own view
  # lives in the weaknet-kernel job.
  #
  # This is a gate, not a diagnostic: every assertion is byte integrity or a
  # relative comparison, and the only skip paths are "this transport cannot
  # establish through this link". What it reports is the data; what it fails on
  # is corruption.
  #
  # Only two weak-net tests run without the opt-in env var: TestWeakNetDelayIsObserved
  # is the always-on proof that the simulator injects at all, and everything else
  # is gated on H2TUNNEL_WEAKNET_BENCH so `-bench .` in the jobs above never
  # picks the profiles up -- lossy QUIC under qemu-user takes minutes per
  # subtest.
  weaknet:
    name: Weak network (userspace link)
    runs-on: ubuntu-latest
    env:
      GODEBUG: http2xconnect=1
      H2TUNNEL_WEAKNET_BENCH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prove the simulator injects and that the rate cap bites
        # The delay test is the harness self-check: without it a silently no-op
        # simulator would let every number below look green. The rate-cap test
        # asserts the cap produces under half the uncapped rate, which is the
        # only way to tell "the cap works" from "the cap is ignored".
        shell: bash
        run: go test -run '^TestWeakNet' -count=1 -timeout 15m -v .

      - name: Throughput matrix over the simulated links
        shell: bash
        run: go test -run '^$' -bench '^BenchmarkWeakNet' -count=1 -timeout 25m .

  # weaknet-kernel: the kernel's view of a degraded link, via a netem qdisc on
  # loopback. Complements the userspace job -- here the kernel retransmitter
  # absorbs the loss, so the measured cost is retransmission overhead rather
  # than datagram drops. Reference numbers only.
  #
  # Reference numbers only, so it never blocks a merge. That is why it stays on
  # push despite having never once produced a number: in every one of its five
  # runs the benchmark step was killed at the job-level wall clock without its
  # own -20m test timeout ever firing, so the process never ran far enough to be
  # timed out. It has been burning six hours of runner time per push with
  # nothing to show for it, and because a job killed by timeout-minutes is
  # *cancelled* rather than *failed*, continue-on-error cannot rescue it --
  # which is why the last few pushes read "cancelled" with every real job green.
  #
  # The probe below is what changes that. If the qdisc on loopback starves the
  # runner's own control channel the probe cannot complete and the job fails in
  # seconds; a *failed* job is covered by continue-on-error, so the run stays
  # green and the log says why. If the probe passes but the benchmark still
  # crawls, the hard `timeout` fails the step the same way. Only a runner that
  # freezes outright still cancels the run, and nothing in this repository can
  # do anything about that.
  weaknet-kernel:
    name: Weak network (kernel netem)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Backstop against a wedged runner, not against a slow benchmark. The
    # benchmark step already caps the test binary at -timeout 20m, so a healthy
    # run needs well under 30 minutes end to end. Without this the job has sat
    # at the 6-hour GitHub default on every push: the last four runs were all
    # killed at exactly 360 minutes, which no -timeout inside the step would
    # have prevented, because a frozen runner counts wall time without running.
    timeout-minutes: 30
    env:
      GODEBUG: http2xconnect=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Queue netem delay and loss on loopback
        id: netem
        shell: bash
        run: |
          set -uo pipefail
          if sudo tc qdisc add dev lo root netem delay 20ms loss 2%; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            sudo tc -s qdisc show dev lo
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::netem is unavailable on this runner; skipping the kernel view"
          fi

      - name: Probe the control channel under netem
        # Distinguishes the two ways this job has died, which no wall-clock
        # limit can. In every one of its runs the benchmark step was killed at
        # the job timeout without its own -20m firing, so the process never ran
        # far enough to be timed out. Most likely the qdisc on loopback starves
        # the runner's own control channel; if so the probe is impossible and the
        # benchmark would never terminate, so netem on loopback is simply the
        # wrong measurement target here and the view is skipped. If the probe
        # passes and the benchmark still hangs, the host froze for another
        # reason and the hard `timeout` below reports it.
        if: steps.netem.outputs.enabled == 'true'
        id: reach
        shell: bash
        run: |
          echo "::group::control-channel reachability under netem"
          if curl -fsS --connect-timeout 5 --max-time 10 -o /dev/null \
              https://api.github.com/ >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reachable: running the benchmark over the netem'd loopback"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "unreachable within 10s: netem on loopback is starving the host"
            echo "control channel, so a benchmark here could never terminate"
            echo "::warning::netem starved the control channel; skipping the kernel view"
          fi
          echo "::endgroup::"

      - name: Throughput over the netem'd loopback
        if: steps.reach.outputs.enabled == 'true'
        shell: bash
        run: |
          # The outer `timeout` exists because -timeout 20m only fires while the
          # test process can still run, and this step has never been allowed to.
          # A hard kill fails the step with a readable message instead of the
          # job being cancelled with none.
          timeout 25m go test -run '^$' -bench '^BenchmarkProtocolThroughput$' \
            -benchtime 3s -timeout 20m .

      - name: Tear down the qdisc
        if: always()
        shell: bash
        run: sudo tc qdisc del dev lo root 2>/dev/null || true

  profile:
    name: Profile (flamegraph)
    runs-on: ubuntu-latest
    needs: test
    # Profiling is just an analysis artifact; infrastructure problems should
    # not block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install graphviz (go tool pprof -svg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Collect CPU + memory profiles from the throughput benchmark
        shell: bash
        run: |
          go test -run '^$' -bench 'BenchmarkProtocolStreaming/Padding=true/(H2|H3)/(Download|Duplex)/Streams=1$' \
            -benchtime 3s -timeout 20m -cpuprofile cpu.out -memprofile mem.out \
            -mutexprofile mutex.out -blockprofile block.out .

      - name: Render flamegraphs and top reports
        shell: bash
        run: |
          mkdir -p profile-out
          go tool pprof -svg cpu.out > profile-out/cpu-flamegraph.svg
          go tool pprof -top cpu.out </dev/null > profile-out/cpu-top.txt
          go tool pprof -svg -sample_index=alloc_space mem.out > profile-out/alloc-flamegraph.svg
          go tool pprof -top -sample_index=alloc_objects mem.out </dev/null > profile-out/alloc-top.txt || true
          go tool pprof -top mutex.out </dev/null > profile-out/mutex-top.txt
          go tool pprof -top block.out </dev/null > profile-out/block-top.txt

      - name: Upload profiles
        uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: profile-out/
          retention-days: 14
