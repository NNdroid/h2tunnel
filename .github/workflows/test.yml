name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # MASQUE-over-h2 (the client MasqueALPN=h2/auto fallback leg) needs x/net
      # extended CONNECT; without it the matching assertions are skipped. GODEBUG
      # must take effect at process start, so it lives at the job level.
      GODEBUG: http2xconnect=1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Build
        shell: bash
        run: go build -v ./...

      - name: Build (32-bit compatibility)
        # Releases ship linux/386 and linux/arm (GOARM=6) binaries. These
        # targets have a 32-bit int and stricter 64-bit atomic alignment
        # rules, so keep them compiling on every push instead of first
        # failing when cutting a release.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          GOOS=linux GOARCH=386 go build ./...
          GOOS=linux GOARCH=arm GOARM=6 go build ./...

      - name: Test (race)
        # quic-go officially does not support Go's race detector on Windows:
        # native crash (Exception 0xc0000005 / unknown pc, see the race
        # detector limitation section in the quic-go README). Race detection on
        # all pure-Go code is covered by linux/macos; Windows runs functional
        # tests only.
        if: runner.os != 'Windows'
        shell: bash
        run: go test -v -timeout 15m -race -coverprofile=coverage.out ./...

      - name: Test (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: go test -v -timeout 15m ./...

      - name: Benchmark (Linux only)
        # go test does not run Benchmark functions by default (needs -bench);
        # run all benchmarks once on a single platform: confirm the benchmarks
        # execute + emit throughput reference values. No -race (race distorts
        # the numbers by orders of magnitude). Absolute values on shared CI
        # runners are noisy, so judge performance regressions from local
        # multi-round results; treat CI numbers as magnitudes / error presence.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -run '^$' -bench . -benchtime 1s -timeout 25m ./...

      - name: Upload coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # test-32bit: run the suite for real on the two 32-bit release targets.
  #
  # The compile gate in the test job above only proves the code builds with a
  # 32-bit int; this job proves it runs. That catches a different class of bug:
  # int truncation in hot paths (benchmarks run long enough for counters to
  # cross 2^31), unaligned or too-small atomic access, and code paths that the
  # suite only reaches under a 32-bit address space.
  #
  # GitHub's hosted runners are 64-bit only, so the binaries execute under
  # user-mode emulation (qemu-user + binfmt). The emulated process talks to the
  # host kernel directly, so loopback TCP/UDP and QUIC sockets behave the same
  # as on a real 32-bit board.
  test-32bit:
    name: Test 32-bit (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same as the native test job: GODEBUG must be in place before the test
      # process starts, or the MASQUE-over-h2 assertions skip silently.
      GODEBUG: http2xconnect=1
      # Match the shipped linux_arm binary exactly (release.yml builds it with
      # GOARM=6). GOARM is ignored for non-arm targets, so this is harmless for
      # 386.
      GOARM: "6"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "386"
            label: linux/386
          - arch: arm
            label: linux/arm GOARM=6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install user-mode emulation (qemu-user + binfmt)
        # Static qemu-user binaries plus the binfmt_misc handler that makes the
        # kernel route 32-bit ELF execution to them. Without binfmt registration
        # the test binary would fail to exec at all.
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          # binfmt_misc occasionally needs the handler map reloaded before the
          # entry shows up. If the 32-bit x86 handler is missing, try to reload
          # it and re-check, so a broken registration fails here with evidence
          # instead of ten minutes into the suite. The handler name may be
          # spelled "386" or "i386" depending on the qemu package version.
          if ! grep -Eq ':(386|i386):' /proc/sys/fs/binfmt_misc/binfmt_misc; then
            sudo update-binfmts --enable --package qemu-user-static || true
            sudo service binfmt-support restart || true
          fi
          if ! grep -Eq ':(386|i386):' /proc/sys/fs/binfmt_misc/binfmt_misc; then
            echo "no 32-bit x86 binfmt handler registered:"
            cat /proc/sys/fs/binfmt_misc/binfmt_misc
            exit 1
          fi

      - name: Vet + smoke test (proves the target execs and runs)
        # Vet first on the 32-bit target (the native job only vets the host
        # arch), then a single fast test so a broken qemu/binfmt setup fails in
        # seconds rather than ten minutes into the suite.
        shell: bash
        run: |
          export GOOS=linux GOARCH=${{ matrix.arch }}
          go vet ./...
          go test -count=1 -run 'TestConfigValidationCanonicalizesDefaults' -timeout 3m .

      - name: Test suite
        # No -race: the race detector plus user-mode emulation is an order of
        # magnitude too slow to fit this job, and quic-go documents that the
        # detector is unsupported on some platforms. Data-race coverage of the
        # same code is already native on 64-bit (the test job's race step).
        # The timeout is ~2x the native one: emulation slows CPU-bound work, and
        # several tests wait out real timers.
        shell: bash
        run: |
          export GOOS=linux GOARCH=${{ matrix.arch }}
          go test -v -count=1 -timeout 30m -coverprofile=coverage-32.out ./...

      - name: Benchmarks
        # Benchmarks on an emulated CPU are canaries, not measurements: they
        # prove the hot paths execute on a 32-bit int without truncation or
        # misalignment faults and still emit sane throughput. Absolute values
        # here must never be compared with the native Benchmark (Linux only)
        # step -- the two differ by the emulation factor, which varies per run.
        # -benchtime is shorter than the native step for the same reason.
        shell: bash
        run: |
          export GOOS=linux GOARCH=${{ matrix.arch }}
          go test -run '^$' -bench . -benchtime 500ms -count=1 -timeout 25m ./...

      - name: Upload 32-bit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-32bit-${{ matrix.arch }}
          path: coverage-32.out
          if-no-files-found: warn
          retention-days: 7

  profile:
    name: Profile (flamegraph)
    runs-on: ubuntu-latest
    needs: test
    # Profiling is just an analysis artifact; infrastructure problems should
    # not block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install graphviz (go tool pprof -svg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Collect CPU + memory profiles from the throughput benchmark
        shell: bash
        run: |
          go test -run '^$' -bench 'BenchmarkProtocolThroughput/(H2_TCP|H2C_TCP|gRPC_TCP|H3_TCP|WT_TCP|MASQUE_TCP|MASQUE_H2_TCP|MASQUE_H3_TCP|MASQUE_H2_UDP|MASQUE_H3_UDP)$' \
            -benchtime 3s -timeout 20m -cpuprofile cpu.out -memprofile mem.out .

      - name: Render flamegraphs and top reports
        shell: bash
        run: |
          mkdir -p profile-out
          go tool pprof -svg cpu.out > profile-out/cpu-flamegraph.svg
          go tool pprof -top cpu.out </dev/null > profile-out/cpu-top.txt
          go tool pprof -svg -sample_index=alloc_space mem.out > profile-out/alloc-flamegraph.svg
          go tool pprof -top -sample_index=alloc_objects mem.out </dev/null > profile-out/alloc-top.txt || true

      - name: Upload profiles
        uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: profile-out/
          retention-days: 14
