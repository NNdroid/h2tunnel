name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to auto-generate)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v1.0.$(date -u +%Y%m%d).$(git rev-list --count HEAD)-$(git rev-parse --short=7 HEAD)"
          fi

          # Normalize manually entered versions so both "1.2.3" and "v1.2.3" work.
          if [[ "$version" != v* ]]; then
            version="v${version}"
          fi

          if [[ ! "$version" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            # ARMv6 keeps the single arm asset compatible with every 32-bit ARM
            # board from ARMv6 up (ARMv7/v8-A32 execute v6 code fine); the
            # default GOARM=7 aborts with "illegal instruction" on ARMv6-class
            # CPUs (Raspberry Pi 1/Zero, older NAS/router SoCs).
            goarm: "6"
          - goos: linux
            goarch: 386
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Empty for non-arm targets, where the go tool ignores GOARM.
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          go build -trimpath -ldflags "-s -w -X github.com/NNdroid/h2tunnel.buildVersion=${VERSION}" \
            -o "h2tunnel_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext || '' }}" ./cmd/h2tunnel

      - name: Show version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./h2tunnel_linux_amd64 version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: h2tunnel_${{ matrix.goos }}_${{ matrix.goarch }}
          path: h2tunnel_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext || '' }}
          if-no-files-found: error

  release:
    name: Publish ${{ needs.prepare.outputs.version }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body: |
            Automated release

            Build version: ${{ needs.prepare.outputs.version }}

            When no version is supplied for a manual run, the version is generated as:
            `v1.0.yyyyMMdd.<commit count>-<short hash>`

            Download the binaries directly, no extraction needed.
          files: dist/*
          generate_release_notes: true
